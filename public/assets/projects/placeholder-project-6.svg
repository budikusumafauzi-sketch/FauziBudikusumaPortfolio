<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Technical Frame Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#d4002d" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#33353c" stroke-width="2"/>
  <path d="M 30 450 L 30 470 L 50 470" fill="none" stroke="#33353c" stroke-width="2"/>
  <path d="M 770 450 L 770 470 L 750 470" fill="none" stroke="#d4002d" stroke-width="2"/>

  <!-- Badge / System Index -->
  <rect x="50" y="50" width="90" height="26" rx="4" fill="#d4002d" fill-opacity="0.15" stroke="#d4002d" stroke-width="1"/>
  <text x="95" y="67" font-family="monospace" font-size="11" fill="#d4002d" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PRJ-06</text>

  <!-- Center Graphic Element -->
  <circle cx="400" cy="220" r="64" fill="#181a20" stroke="#262830" stroke-width="2"/>
  <circle cx="400" cy="220" r="48" fill="none" stroke="#d4002d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="400" cy="220" r="6" fill="#d4002d" />

  <!-- Title & Description -->
  <text x="400" y="330" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f0f2f5" text-anchor="middle" letter-spacing="0.5">Data Center Network Simulation</text>
  <text x="400" y="360" font-family="monospace" font-size="13" fill="#8f94a0" text-anchor="middle" letter-spacing="1">Leaf-Spine / VLAN / BGP</text>

  <!-- Status Marker -->
  <rect x="300" y="400" width="200" height="28" rx="14" fill="#16181d" stroke="#2c2e36" stroke-width="1"/>
  <circle cx="320" cy="414" r="4" fill="#00e599" />
  <text x="405" y="418" font-family="monospace" font-size="10" fill="#a0a5b2" text-anchor="middle" letter-spacing="1">MODULAR PLACEHOLDER</text>
</svg>